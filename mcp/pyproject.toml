[project]
name = "amber-mcp"
version = "1.0.0"
description = "MCP server for Amber: lets AI agents list templates, validate designs, and run simulations."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
]

[project.scripts]
amber-mcp = "amber_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]
