name: Publish

# Build the Dockerfile and push it to ghcr.io/<owner>/amber:<sha> and :latest (plan §15.2, §15.4).
# Manual only: run it from the Actions tab, then deploy that sha by hand. No Azure credentials here.
# Zero spend: Actions minutes and ghcr.io storage are free for a public repository.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to this repo's ghcr.io package with the built-in GITHUB_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # arm64 too, so `docker run` works natively on an Apple-silicon Mac; Azure pulls the amd64 one.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          # Links the package to this repo, so it shows on the repo page.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: AMBER_SHA=${{ github.sha }} # /healthz reports it, so a deploy can be confirmed
          cache-from: type=gha
          cache-to: type=gha,mode=max
