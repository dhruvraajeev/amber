name: Pages

# Publish pages/ to dhruvraajeev.github.io/amber: a redirect to the Azure URL, which Azure picks at random.
# Zero spend: Pages and Actions are free for a public repository.
on:
  push:
    branches: [main]
    paths: [pages/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # deploy-pages proves the upload came from this workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp pages/index.html pages/404.html # any /amber/<path> redirects too
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@v4
